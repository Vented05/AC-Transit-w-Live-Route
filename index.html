<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18865F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bus Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>Bus Tracker (unofficial)</title>
<style>
:root{--g:#18865F;--o:#EE8329;--c:#222;--m:#b9c2bd;--hh:60px}
*{box-sizing:border-box;font-family:-apple-system,Montserrat,Helvetica,Arial,sans-serif}
html,body{margin:0;background:#000;color:#fff}
header{background:var(--g);height:calc(var(--hh) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:20}
.logo{font-style:italic;font-size:15px;font-weight:600}.logo b{font-size:24px;margin-right:4px}
header small{margin-left:auto;font-size:11px;opacity:.9;text-align:right}
nav button{background:none;border:0;color:#fff;font-weight:600;min-height:44px;padding:0 16px;border-radius:0;opacity:.85}
nav button.on{opacity:1;box-shadow:inset 0 -3px 0 var(--o)}
#bnav{display:none}
#app{display:flex;height:calc(100dvh - var(--hh) - env(safe-area-inset-top))}
#side{width:430px;flex:none;overflow:auto;padding:12px 14px}
#mapwrap{flex:1;position:relative}#map{height:100%;background:#eee}
.card{background:var(--c);border-radius:14px;padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.rt{color:#3fd49a;font-size:28px;font-weight:700;min-width:46px}
.m{color:var(--m);font-size:13px;margin-top:4px}
button,input,select{font:inherit;color:inherit}
button{background:var(--g);border:0;border-radius:10px;padding:0 14px;min-height:44px;font-weight:600}
button.o{background:var(--o);color:#111}button.g{background:#3a3f3c}
.star{background:none;color:var(--o);font-size:28px;padding:0 6px}
input{background:#111;border:1px solid #666;border-radius:10px;padding:0 12px;min-height:44px;width:100%}
input[type=radio]{width:auto;min-height:0}
label{font-size:12px;color:var(--m);display:block;margin:8px 0 4px}
.chips{display:flex;gap:10px;overflow-x:auto;margin-top:10px;scroll-snap-type:x proximity;padding-bottom:2px}
.chip{flex:none;min-width:150px;display:flex;align-items:center;gap:10px;text-align:left;scroll-snap-align:start;min-height:50px}
.chip b{font-size:20px}.chip span{font-size:12px}
.ld{color:#6be39f;letter-spacing:1px;margin-left:auto;font-size:11px}
.sug button{display:block;width:100%;text-align:left;background:#2c302d;border-radius:0;font-weight:500;font-size:13px;padding:8px 12px;min-height:40px}
.alert{position:sticky;top:0;z-index:6;background:var(--o);color:#111;border-radius:14px;padding:14px;margin-bottom:12px;font-weight:700}
.alert.go{background:#e5384c;color:#fff;font-size:20px}
.err{background:#4a1d22;border-radius:10px;padding:10px;margin-bottom:12px;font-size:13px}
.stp{padding:10px 0;border-bottom:1px solid #333}
.opt{border:2px solid transparent}.badge{background:var(--g);border-radius:12px;padding:2px 9px;font-weight:700;font-size:13px}
.ovc{position:absolute;left:16px;right:16px;bottom:16px;z-index:500;background:#1c1f1d;border-radius:14px;padding:14px 18px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pill{background:var(--o);color:#111;font-size:11px;font-weight:700;border-radius:10px;padding:3px 10px}
.big{font-size:28px;font-weight:700;margin-top:8px}.big small{font-size:13px;font-weight:500;color:var(--m)}
.bar{height:8px;background:#444b47;border-radius:4px;margin:10px 0 6px}.bar i{display:block;height:8px;background:var(--o);border-radius:4px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.5) rotate(-12deg)}to{transform:none}}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.card{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(n+6){animation-delay:.25s}
.noanim .card,.noanim .stp{animation:none}
.alert{animation:drop .35s ease both}.ovc{animation:up .45s cubic-bezier(.2,.8,.2,1) both}.ovc.na{animation:none}
.sk{min-height:84px;background:linear-gradient(100deg,#222 30%,#333 50%,#222 70%) 0 0/200% 100%;animation:shim 1.2s linear infinite}
button{transition:transform .12s,filter .15s,background .2s}button:active{transform:scale(.95)}button:hover{filter:brightness(1.12)}
.star.pop{animation:pop .4s ease}.chip{transition:transform .15s,filter .15s}.chip:active{transform:scale(.97)}
nav button{transition:box-shadow .25s,opacity .25s}
.busm{transition:transform 1.5s linear}.bar i{transition:width 1s ease}
#v{animation:rise .3s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.seg{display:flex;margin:-12px -14px 12px;background:#000;border-bottom:1px solid #333;position:sticky;top:0;z-index:7}
.seg button{flex:1;background:#000;border-radius:0;color:var(--m);box-shadow:inset 0 -3px 0 transparent}
.seg button.on{color:#fff;box-shadow:inset 0 -3px 0 var(--o)}
.ld{display:inline-flex;gap:1px;margin-left:auto}
.tl{border-left:4px solid #555;margin:8px 0 0 8px;padding-left:20px}
.ti{position:relative;padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.ti .d{position:absolute;left:-32px;top:18px;width:16px;height:16px;border-radius:8px;background:#777}.ti .d.t{background:var(--o)}
.r{color:#ff5a4d;font-weight:700}.nx{background:#666;color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:6px 8px;text-align:center}
.bm{width:44px;height:44px;border-radius:50%;border:3px solid var(--o);background:#1c1b4d;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 0 5px rgba(238,131,41,.25)}
.bm .ar{position:absolute;left:50%;top:50%;margin:-8px 0 0 -8px;border:8px solid transparent;border-bottom:14px solid var(--o);transform:rotate(var(--h,0deg)) translateY(-34px)}
.lk{display:flex;justify-content:space-between;padding:14px;background:#222;border-radius:14px;margin-bottom:8px;color:#fff;text-decoration:none}
.sh{color:var(--m);font-size:12px;font-weight:700;margin:16px 0 8px;letter-spacing:.5px}
.li{display:block;width:100%;text-align:left;background:#222;border-radius:0;padding:12px 8px;border-bottom:1px solid #333;min-height:60px}
body.mapfull #v>*:not(.seg){display:none}
@media(max-width:899px){body.mapfull #mapwrap{height:calc(100dvh - 190px)}}
@media(max-width:899px){
 header nav{display:none}header small{font-size:10px}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--g);padding-bottom:env(safe-area-inset-bottom);z-index:30}
 #bnav button{flex:1;min-height:56px;font-size:12px}
 #app{display:block;height:auto;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
 #side{width:auto;overflow:visible}
 #mapwrap{display:none}body.mapon #mapwrap{display:block;height:42vh;position:sticky;top:calc(var(--hh) + env(safe-area-inset-top));z-index:10}
 .up{display:none}.ovc{left:8px;right:8px;bottom:8px;padding:10px 14px}.big{font-size:22px;margin-top:4px}
}
</style></head><body>
<header><div class="logo"><b>AC</b>TRANSIT</div><nav id="hn"></nav><small>Unofficial · not an AC Transit product</small></header>
<div id="app"><aside id="side"><div id="v"></div></aside><div id="mapwrap"><div id="map"></div><div id="ov"></div></div></div>
<nav id="bnav"></nav>
<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PX=((p=>p&&!/^https?:\/\//i.test(p)?'https://'+p:p)((localStorage.proxy||(/YOUR-WORKER/.test(window.APP_CONFIG?.proxy||'')?'':window.APP_CONFIG?.proxy)||'').trim())).replace(/\/*$/,''),B=PX?PX+'/':'https://api.actransit.org/transit/',$=s=>document.querySelector(s);
let tok=localStorage.tok||'',favs=JSON.parse(localStorage.favs||'[]'),timer,wake,watch,me,meT=0,tab='home',prevTab='home',TR=null,P={mode:'now'},CARDS={},plans=[];
const TABS=[['home','Home'],['favs','Favorites'],['search','Search'],['more','More']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=(a,b)=>{const r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lon-a.lon)*r/2)**2;return 41804462*Math.asin(Math.sqrt(x))};
const pt=s=>{const m=/(\d{4})(\d\d)(\d\d) (\d\d):(\d\d)/.exec(s||'');return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]):null};
const fmt=d=>(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+(d.getHours()<12?'am':'pm');
const mins=p=>p.prdctdn==='DUE'||p.prdctdn==='Due'?'Due':p.prdctdn+' min';
const fk=f=>f.id+'|'+f.rt+'|'+f.dir;
const load=s=>{const n={EMPTY:1,HALF_EMPTY:2,FULL:3}[s];if(!n)return'';const c=n==1?'#2bd35f':n==2?'#f1c40f':'#ff5a4d';
 return `<span class="ld" title="${esc(s)}">${[1,2,3].map(k=>{const f=k<=n?c:'#ccc';return `<svg width="11" height="22" viewBox="0 0 11 22"><circle cx="5.500" cy="4" r="3.500" fill="${f}"/><path d="M1 21V10c0-2 1.500-3.500 4.500-3.500S10 8 10 10v11z" fill="${f}"/></svg>`}).join('')}</span>`};
async function api(p){if(!tok&&!PX)throw Error('Add your API token in Settings first.');
 const r=await fetch(B+p+(tok?(p.includes('?')?'&':'?')+'token='+encodeURIComponent(tok):''));
 if(!r.ok){const t=(await r.text()).slice(0,160);throw Error('API '+r.status+' '+t)}return r.json()}
async function bt(p){const j=await api(p);return j['bustime-response']||j}
function poll(fn,ms){clearInterval(timer);fn();timer=setInterval(fn,ms)}
function show(h){$('#v').innerHTML=h}
function fail(e){document.querySelectorAll('.err').forEach(x=>x.remove());const d=document.createElement('div');d.className='err';d.textContent=e.message+(/fetch/i.test(e.message)?' (blocked by browser/CORS – set a Proxy URL in Settings, see README)':'');$('#v').prepend(d)}
function locate(){if(me&&Date.now()-meT<30000)return Promise.resolve(me);
 return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>{me={lat:p.coords.latitude,lon:p.coords.longitude};meT=Date.now();res(me)},()=>rej(Error('Location permission needed – allow it in Safari settings.')),{enableHighAccuracy:true,timeout:10000}))}
async function nearStops(lat,lon,ft){let a,last;lat=(+lat).toFixed(5);lon=(+lon).toFixed(5);
 for(const u of [`stops/${lat}/${lon}/?distance=${ft}`,`stops/${lat}/${lon}/?distance=${ft}&active=false`,`stops/${lat}/${lon}/?distance=${ft}&active=true`,`stops/${lat}/${lon}?distance=${ft}`]){try{a=await api(u);break}catch(e){last=e}}
 if(!a)throw last;a=Array.isArray(a)?a:(a.Stops||a.stops||[]);
 return a.map(s=>({id:String(s.StopId),name:s.Name,lat:s.Latitude,lon:s.Longitude}))}

/* map */
const map=L.map('map').setView([37.69,-122.1],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
let LG=L.layerGroup().addTo(map);
const dot=(c,col,r=7)=>L.circleMarker([c.lat,c.lon],{radius:r,color:'#fff',weight:2,fillColor:col,fillOpacity:1});
function mapStops(s){LG.clearLayers();s.forEach(x=>dot(x,'#18865F').bindTooltip(x.name).addTo(LG));
 if(me)dot(me,'#1d5fd0',9).addTo(LG);const pts=s.map(x=>[x.lat,x.lon]);if(me)pts.push([me.lat,me.lon]);if(pts.length)map.fitBounds(pts,{padding:[40,40],maxZoom:16})}

/* nav */
function drawNav(){const h=TABS.map(([k,n])=>`<button data-t="${k}" class="${k===tab?'on':''}">${n}</button>`).join('');$('#hn').innerHTML=h;$('#bnav').innerHTML=h}
function go(t){clearInterval(timer);TR=null;LG.clearLayers();$('#ov').innerHTML='';document.body.classList.remove('mapon','mapfull');
 if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null}if(wake){wake.release().catch(()=>{});wake=null}
 tab=t;drawNav();({home,favs:favsV,search:searchV,more})[t]();setTimeout(()=>map.invalidateSize(),60)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t)go(t.dataset.t)});

/* cards (shared by Home + Favorites) */
const chip=p=>`<button class="chip" data-v="${esc(p.vid)}" data-r="${esc(p.rt)}" data-d="${esc(p.des)}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="2" width="14" height="14" rx="3" fill="#fff"/><rect x="5" y="5" width="10" height="4" fill="#18865F"/><circle cx="6.500" cy="13" r="1.200" fill="#18865F"/><circle cx="13.500" cy="13" r="1.200" fill="#18865F"/></svg><span>${esc(p.vid)}</span><b>${mins(p)}</b>${load(p.psgld)}</button>`;
const card=c=>{const k=fk(c),on=favs.some(f=>fk(f)===k),d=me&&c.lat?(H(me,c)/5280).toFixed(1)+' miles':'';
 return `<div class="card"><div class="row"><div class="rt">${esc(c.rt)}</div><b class="sp">→ ${esc(c.dir)}</b><button class="star" data-star="${esc(k)}" aria-label="Toggle favorite">${on?'★':'☆'}</button></div><div class="m">Stop: ${esc(c.name)} (${esc(c.id)})</div><div class="m">${d}</div><div class="chips">${c.p.length?c.p.map(chip).join(''):'<span class="m">No upcoming buses</span>'}</div></div>`};
async function cardsFor(stops,el,o={}){const G=new Map(),S={};stops.forEach(s=>S[s.id]=s);
 (o.favs||[]).forEach(f=>G.set(fk(f),{...f,p:[]}));const prd=[];
 for(let i=0;i<stops.length;i+=10){try{prd.push(...((await bt('actrealtime/prediction?stpid='+stops.slice(i,i+10).map(s=>s.id).join(','))).prd||[]))}catch(e){fail(e)}}
 prd.forEach(p=>{const s=S[p.stpid]||{},k=p.stpid+'|'+p.rt+'|'+p.rtdir;if(o.favs&&!G.has(k))return;
  if(!G.has(k))G.set(k,{id:p.stpid,name:p.stpnm,lat:s.lat,lon:s.lon,rt:p.rt,dir:p.rtdir,p:[]});G.get(k).p.push(p)});
 let a=[...G.values()];if(!o.favs&&me)a.sort((x,y)=>H(me,x)-H(me,y));
 a.forEach(c=>CARDS[fk(c)]=c);el.classList.toggle('noanim',!!el.dataset.done);el.dataset.done=1;el.innerHTML=a.length?a.map(card).join(''):'<div class="card m">No upcoming buses found.</div>'}
$('#v').addEventListener('click',async e=>{const hm=e.target.closest('[data-hm]'),sq2=e.target.closest('[data-sq]'),pk=e.target.closest('[data-pick]');
 if(hm){document.body.classList.toggle('mapon',hm.dataset.hm==='m');document.body.classList.toggle('mapfull',hm.dataset.hm==='m');document.querySelectorAll('[data-hm]').forEach(b=>b.classList.toggle('on',b===hm));setTimeout(()=>map.invalidateSize(),80)}
 if(sq2){SQ=sq2.dataset.sq;searchV()}
 if(pk&&PK)PK(pk.dataset.pick);
 if(e.target.id==='tpb'){$('#tpf').innerHTML='<iframe title="AC Transit trip planner" src="https://tp.actransit.org/?standalone=true#/" allow="geolocation" style="width:100%;height:72vh;border:0;border-radius:14px;background:#fff"></iframe>'}
const c=e.target.closest('.chip'),s=e.target.closest('[data-star]'),g=e.target.closest('[data-gi]');
 if(c)track(c.dataset.v,c.dataset.r,c.dataset.d);
 if(g&&TR)TR.set(g.dataset.gi,g.dataset.gn);
 if(s){const k=s.dataset.star,f=CARDS[k];if(!f)return;const on=favs.some(x=>fk(x)===k);
  favs=on?favs.filter(x=>fk(x)!==k):[...favs,{id:f.id,name:f.name,lat:f.lat,lon:f.lon,rt:f.rt,dir:f.dir}];
  localStorage.favs=JSON.stringify(favs);s.textContent=on?'☆':'★';s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');if(tab==='favs'&&on)favsV()}
 if(e.target.id==='sg'){const id=$('#si').value.trim();if(!id)return;
  try{const x=(await bt('actrealtime/stop?stpid='+encodeURIComponent(id))).stops?.[0];
   const st=x?{id:String(x.stpid),name:x.stpnm,lat:+x.lat,lon:+x.lon}:{id,name:'Stop '+id};await cardsFor([st],$('#lk'))}catch(er){fail(er)}}});

function home(){show(`<div class="seg"><button data-hm="n" class="on">Nearby</button><button data-hm="m">Map</button></div><div id="cl"><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div></div><div class="card"><b>Look up a stop</b><div class="row" style="margin-top:8px"><input id="si" inputmode="numeric" placeholder="Stop ID, e.g. 52711" aria-label="Stop ID"><button id="sg">Go</button></div></div><div id="lk"></div>`);
 poll(async()=>{try{const m=await locate(),s=(await nearStops(m.lat,m.lon,1500)).slice(0,10);mapStops(s);await cardsFor(s,$('#cl'));
  document.querySelectorAll('.err').forEach(x=>x.remove())}catch(e){$('#cl').innerHTML='';fail(e)}},20000)}
function favsV(){show('<div id="cl"></div>');
 poll(async()=>{if(!favs.length){$('#cl').innerHTML='<div class="card m">No favorites yet. Tap ☆ on a route card on the Home tab.</div>';return}
  try{const u={};favs.forEach(f=>u[f.id]=f);await cardsFor(Object.values(u),$('#cl'),{favs});document.querySelectorAll('.err').forEach(x=>x.remove())}catch(e){fail(e)}},20000)}

/* trip planner */
const geo=async q=>{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=us&viewbox=-122.6,38.1,-121.6,37.2&bounded=1&q='+encodeURIComponent(q));
 return(await r.json()).map(x=>({name:x.display_name.split(',').slice(0,3).join(','),lat:+x.lat,lon:+x.lon}))};
async function resolve(k){const el=$('#p'+k),v=el.value.trim();
 if(!v||(k==='f'&&v==='Current location')){if(k==='f')return await locate();return null}
 if(P[k]&&P[k].name===v)return P[k];
 if(/^\d{4,6}$/.test(v)){const x=(await bt('actrealtime/stop?stpid='+v)).stops?.[0];if(!x)throw Error('Stop '+v+' not found.');return P[k]={name:x.stpnm,lat:+x.lat,lon:+x.lon}}
 const r=(await geo(v))[0];if(!r)throw Error('Couldn’t find “'+v+'” in the Bay Area.');el.value=r.name;return P[k]=r}
let sugT;
function sug(k){const el=$('#p'+k);el.oninput=()=>{clearTimeout(sugT);const v=el.value.trim(),l=$('#s'+k);P[k]=null;l.innerHTML='';if(v.length<3||/^\d+$/.test(v))return;
 sugT=setTimeout(async()=>{try{const r=await geo(v);l.innerHTML=r.map((x,i)=>`<button data-i="${i}">${esc(x.name)}</button>`).join('');
  l.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;P[k]=r[b.dataset.i];el.value=P[k].name;l.innerHTML=''}}catch(e){}},600)}}
let SQ='line',PK=null,ALL=null;
function searchV(){show(`<div class="seg">${[['line','Select line'],['stop','Select stop'],['plan','Plan trip']].map(([k,n])=>`<button data-sq="${k}" class="${k===SQ?'on':''}">${n}</button>`).join('')}</div><div id="sb"></div>`);
 ({line:lineV,stop:stopSV,plan:()=>{planV();$('#sb').insertAdjacentHTML('beforeend','<div class="card"><b>AC Transit’s own trip planner</b><div class="m">Schedule-based, with transfers, same one the official app opens.</div><p><button id="tpb">Show it here</button> <a class="lk" style="display:inline-flex;margin:0 0 0 8px;padding:12px 14px" target="_blank" rel="noopener" href="https://tp.actransit.org/?standalone=true#/">Open in new tab</a></p><div id="tpf"></div></div>')}})[SQ]()}
const list=(a,f)=>a.map((x,i)=>`<button class="li" data-pick="${i}">${f(x)}</button>`).join('');
function filt(items,f,render,onpick){const el=$('#sb');el.innerHTML=`<input id="q" placeholder="Search" aria-label="Search" style="margin-bottom:10px"><div id="ls"></div>`;
 const draw=()=>{const v=$('#q').value.toLowerCase(),a=items.filter(x=>f(x).toLowerCase().includes(v)).slice(0,60);$('#ls').innerHTML=list(a,render);PK=i=>onpick(a[i])};$('#q').oninput=draw;draw()}
async function lineV(){$('#sb').innerHTML='<div class="card sk"></div>';
 try{const x=await bt('actrealtime/line'),a=x.routes||x.lines||[];
  filt(a,r=>r.rt+' '+(r.rtnm||''),r=>`<b style="font-size:20px">${esc(r.rt)}</b><div class="m">${esc(r.rtnm||'')}</div>`,dirV)}catch(e){fail(e)}}
async function dirV(r){$('#sb').innerHTML='<div class="card sk"></div>';
 try{const x=await bt('actrealtime/direction?rt='+encodeURIComponent(r.rt)),a=(x.directions||x.dirs||[]).map(d=>d.dir||d.name||d.id||d);
  $('#sb').innerHTML=`<div class="sh">LINE ${esc(r.rt)} – SELECT DIRECTION</div>${list(a,d=>`<b>${esc(d)}</b>`)}`;PK=i=>stpV(r,a[i]);
  bt('actrealtime/servicebulletin?rt='+encodeURIComponent(r.rt)).then(b=>{const sb=b.sb||b.bulletins||[];if(sb.length)$('#sb').insertAdjacentHTML('afterbegin',sb.slice(0,3).map(z=>`<div class="alert" style="font-size:13px">⚠ ${esc(z.sbj||z.nm||z.brf||'Service bulletin')}</div>`).join(''))}).catch(()=>{});
  bt('actrealtime/detour?rt='+encodeURIComponent(r.rt)).then(b=>{const d=b.dtrs||b.detours||[];if(d.length)$('#sb').insertAdjacentHTML('afterbegin',`<div class="alert go" style="font-size:14px">Detour in effect on line ${esc(r.rt)}</div>`)}).catch(()=>{})}catch(e){fail(e)}}
async function stpV(r,d){$('#sb').innerHTML='<div class="card sk"></div>';
 try{const x=await bt(`actrealtime/stop?rt=${encodeURIComponent(r.rt)}&dir=${encodeURIComponent(d)}`),a=(x.stops||[]).map(s=>({id:String(s.stpid),name:s.stpnm,lat:+s.lat,lon:+s.lon}));
  filt(a,s=>s.name+' '+s.id,s=>`<b>${esc(s.name)}</b><div class="m">Stop ID: ${esc(s.id)}</div>`,s=>shStop(s))}catch(e){fail(e)}}
async function shStop(s){$('#sb').innerHTML=`<div class="sh">${esc(s.name)}</div><div id="lk"></div>`;clearInterval(timer);
 const run=async()=>{try{await cardsFor([s],$('#lk'))}catch(e){fail(e)}};timer=setInterval(run,20000);run();if(s.lat){LG.clearLayers();dot(s,'#18865F',9).addTo(LG);map.setView([s.lat,s.lon],15)}}
async function stopSV(){$('#sb').innerHTML='<div class="card sk"></div>';
 try{if(!ALL){const x=await bt('actrealtime/allstops');ALL=(x.stops||[]).map(s=>({id:String(s.stpid),name:s.stpnm,lat:+s.lat,lon:+s.lon}))}
  filt(ALL,s=>s.name+' '+s.id,s=>`<b>${esc(s.name)}</b><div class="m">Stop ID: ${esc(s.id)}</div>`,shStop)}catch(e){fail(e)}}
function planV(){$('#sb').innerHTML=(`<div class="card"><label for="pf">From</label><input id="pf" placeholder="Current location" value="${esc(P.f?.name||'Current location')}"><div class="sug" id="sf"></div>
<label for="pt">To</label><input id="pt" placeholder="Address, place or stop ID" value="${esc(P.t?.name||'')}"><div class="sug" id="st"></div>
<div class="row" style="margin:12px 0;flex-wrap:wrap"><label style="margin:0"><input type="radio" name="m" value="now" ${P.mode==='now'?'checked':''}> Leave now</label><label style="margin:0"><input type="radio" name="m" value="at" ${P.mode==='at'?'checked':''}> Depart at</label><input type="time" id="tm" aria-label="Departure time" style="width:140px" value="${esc(P.tm||'')}"></div>
<button class="o" id="go" style="width:100%">Plan trip</button></div><div id="res"></div>`);
 sug('f');sug('t');$('#pf').onfocus=e=>e.target.select();document.querySelectorAll('[name=m]').forEach(r=>r.onchange=()=>{P.mode=r.value});$('#tm').onchange=()=>{P.tm=$('#tm').value;P.mode='at';document.querySelector('[name=m][value=at]').checked=true};
 $('#go').onclick=plan;if(plans.length)drawPlans()}
const SC={};
async function coords(ids){const need=[...new Set(ids)].filter(i=>!SC[i]),ch=[];for(let i=0;i<need.length;i+=10)ch.push(need.slice(i,i+10));
 await Promise.all(ch.map(c=>bt('actrealtime/stop?stpid='+c.join(',')).then(r=>(r.stops||[]).forEach(x=>SC[x.stpid]={lat:+x.lat,lon:+x.lon})).catch(()=>{})))}
async function plan(){const res=$('#res');res.innerHTML='<div class="card sk m">Planning (checking transfers can take a few seconds)…</div><div class="card sk"></div>';
 try{const o=await resolve('f'),d=await resolve('t');if(!d)throw Error('Enter a destination.');
  let t0=new Date();if(P.mode==='at'&&$('#tm').value){const[h,m]=$('#tm').value.split(':');t0.setHours(+h,+m,0,0);if(t0<Date.now()-6e4)t0.setDate(t0.getDate()+1)}
  const[os,ds]=await Promise.all([nearStops(o.lat,o.lon,2000),nearStops(d.lat,d.lon,2500)]);
  if(!os.length||!ds.length)throw Error('No bus stops within walking distance of the '+(os.length?'destination':'start')+'.');
  const om={},dm={};os.slice(0,10).forEach(s=>{s.w=Math.ceil(H(o,s)/264);om[s.id]=s});ds.forEach(s=>dm[s.id]=s);
  const prd=((await bt('actrealtime/prediction?stpid='+Object.keys(om).join(','))).prd||[]).map(p=>({...p,dep:pt(p.prdtm)}))
   .filter(p=>p.dep&&p.dep>=new Date(t0.getTime()+om[p.stpid].w*6e4)).sort((a,b)=>a.dep-b.dep);
  const seen=new Set(),cand=[];prd.forEach(p=>{if(!seen.has(p.vid)&&cand.length<10){seen.add(p.vid);cand.push(p)}});
  const rs=await Promise.allSettled(cand.map(p=>bt('actrealtime/prediction?vid='+p.vid)));
  const A=[];rs.forEach((r,i)=>{if(r.status==='fulfilled')A.push({p:cand[i],l:(r.value.prd||[]).filter(q=>+q.seq>+cand[i].seq&&pt(q.prdtm))})});
  const leg=(p,q)=>({rt:p.rt,des:p.des,vid:p.vid,from:{id:p.stpid,name:p.stpnm},to:{id:q.stpid,name:q.stpnm},dep:pt(p.prdtm),arr:pt(q.prdtm),n:+q.seq-+p.seq});
  const out=[];
  A.forEach(({p,l})=>{let best;l.filter(q=>dm[q.stpid]).forEach(q=>{const w=Math.ceil(H(dm[q.stpid],d)/264),end=new Date(pt(q.prdtm).getTime()+w*6e4);if(!best||end<best.end)best={q,w,end}});
   if(best){const w1=om[p.stpid].w;out.push({legs:[leg(p,best.q)],w1,w2:best.w,start:new Date(pt(p.prdtm).getTime()-w1*6e4),end:best.end})}});
  try{const dp=(await bt('actrealtime/prediction?stpid='+ds.slice(0,10).map(s=>s.id).join(','))).prd||[];
   const bv=[...new Set(dp.map(x=>x.vid))].filter(v=>!seen.has(v)).slice(0,6);
   const br=await Promise.allSettled(bv.map(v=>bt('actrealtime/prediction?vid='+v)));const Bs=[];
   br.forEach(r=>{if(r.status!=='fulfilled')return;const l=(r.value.prd||[]).filter(q=>pt(q.prdtm)),k=l.findIndex(q=>dm[q.stpid]);if(k>0)Bs.push({board:l.slice(Math.max(0,k-15),k),q:l[k]})});
   const As=A.slice(0,5).map(a=>({p:a.p,l:a.l.slice(0,15)}));
   await coords([...As.flatMap(a=>a.l.map(q=>q.stpid)),...Bs.flatMap(b=>b.board.map(q=>q.stpid))]);
   As.forEach(({p,l})=>Bs.forEach(b=>{let best;
    l.forEach(a=>b.board.forEach(bq=>{const ca=SC[a.stpid],cb=SC[bq.stpid];if(!ca||!cb||p.rt===bq.rt)return;const ft=a.stpid===bq.stpid?0:H(ca,cb);if(ft>900)return;const wx=Math.ceil(ft/264);
     if(pt(bq.prdtm)<new Date(pt(a.prdtm).getTime()+(wx+2)*6e4))return;
     const w2=Math.ceil(H(dm[b.q.stpid],d)/264),end=new Date(pt(b.q.prdtm).getTime()+w2*6e4);if(!best||end<best.end)best={a,bq,wx,w2,end}}));
    if(best){const w1=om[p.stpid].w;out.push({legs:[leg(p,best.a),leg(best.bq,b.q)],wx:best.wx,w1,w2:best.w2,start:new Date(pt(p.prdtm).getTime()-w1*6e4),end:best.end})}}))}catch(e){}
  plans=out.sort((a,b)=>a.end-b.end).filter((x,i,a)=>a.findIndex(y=>y.legs.map(l=>l.vid).join()===x.legs.map(l=>l.vid).join())===i).slice(0,6);P.o=o;P.d=d;
  if(!plans.length){res.innerHTML=`<div class="card m">No direct or one-transfer route found${P.mode==='at'?' for that time. Live predictions only reach a short time ahead':''}.</div>`;return}
  drawPlans()}catch(e){res.innerHTML='';fail(e)}}
function drawPlans(){const o=P.o,d=P.d;LG.clearLayers();dot(o,'#1d5fd0',9).addTo(LG);dot(d,'#d62f4b',9).addTo(LG);map.fitBounds([[o.lat,o.lon],[d.lat,d.lon]],{padding:[50,50]});
 $('#res').innerHTML=`<div class="card" style="background:#006E50;padding:10px 14px"><b>We found ${plans.length} option${plans.length>1?'s':''}</b><div class="m">Direct and one-transfer · live predictions · estimates only</div></div>`+plans.map((x,i)=>`<div class="card opt"><div class="row"><b class="sp">${fmt(x.start)}–${fmt(x.end)}</b><b style="font-size:18px">${Math.round((x.end-x.start)/6e4)} min</b></div>
<div class="m">Walk ${x.w1} min → ${x.legs.map(l=>`<span class="badge">${esc(l.rt)}</span>`).join(` → Walk ${x.wx} min → `)} → Walk ${x.w2} min</div>`+
 x.legs.map((l,j)=>`${j?`<div class="m" style="margin:8px 0">↳ Transfer: walk ${x.wx} min to ${esc(l.from.name)}</div>`:''}<div class="stp"><b>${fmt(l.dep)}</b> Board line ${esc(l.rt)} at ${esc(l.from.name)}<div class="m">to ${esc(l.des)} · Bus ${esc(l.vid)} · ${l.n} stop${l.n>1?'s':''}</div><div style="margin-top:6px"><b>${fmt(l.arr)}</b> Get off at ${esc(l.to.name)}</div><button class="o" data-plan="${i}|${j}" style="width:100%;margin-top:8px">Track ${x.legs.length>1?'leg '+(j+1):'this bus'}</button></div>`).join('')+`</div>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-plan]');if(b){const[i,j]=b.dataset.plan.split('|'),l=plans[i].legs[j];track(l.vid,l.rt,l.des,{target:{id:l.to.id,n:l.to.name}})}});

/* tracking */
function track(vid,rt,des,opt={}){prevTab=tab;clearInterval(timer);LG.clearLayers();
 let target=opt.target?{vid,...opt.target}:JSON.parse(localStorage.target||'null');if(target&&target.vid!=vid)target=null;
 if(opt.target)localStorage.target=JSON.stringify(target);
 let alerted=false,seen=false,bus,len=0,line,me2,first=true;
 show(`<div id="al"></div><button class="g" id="bk">← Back</button><div class="card" style="margin-top:12px"><b>Line ${esc(rt)} to ${esc(des)}</b><div class="m">Bus ${esc(vid)} · tap “Get off here” on your stop</div></div><div class="card" id="stl"></div>`);
 $('#bk').onclick=()=>go(prevTab);document.body.classList.add('mapon');setTimeout(()=>map.invalidateSize(),60);
 if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});
 watch=navigator.geolocation.watchPosition(p=>{const c={lat:p.coords.latitude,lon:p.coords.longitude};me2?me2.setLatLng([c.lat,c.lon]):me2=dot(c,'#1d5fd0',9).addTo(map)});
 const banner=(h,c)=>{$('#al').innerHTML=h?`<div class="alert ${c||''}">${h}</div>`:''};
 const fire=()=>{alerted=true;banner('🔔 Get off next: '+esc(target.n),'go');if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);
  if('Notification'in window&&Notification.permission==='granted')new Notification('Time to get off',{body:target.n,requireInteraction:true})};
 TR={set(id,n){target={vid,id,n};localStorage.target=JSON.stringify(target);alerted=false;seen=false;
  if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();tick()}};
 async function tick(){try{
  const v=(await bt('actrealtime/vehicle?vid='+vid)).vehicle?.[0];let pct=null;
  if(v){const c={lat:+v.lat,lon:+v.lon};
   if(bus)bus.setLatLng([c.lat,c.lon]);else bus=L.marker([c.lat,c.lon],{icon:L.divIcon({html:`<div class="bm"><i class="ar"></i>${esc(rt)}</div>`,iconSize:[44,44],iconAnchor:[22,22],className:'busm'})}).addTo(map);
   bus.getElement()?.style.setProperty('--h',(+v.hdg||0)+'deg');
   if(first){map.setView([c.lat,c.lon],15);first=false}
   if(!line&&v.pid){line=1;bt('actrealtime/pattern?pid='+v.pid).then(r=>{const p=r.ptr?.[0];if(!p)return;len=+p.ln||0;
    L.polyline(p.pt.map(q=>[+q.lat,+q.lon]),{color:'#EE8329',weight:6}).addTo(LG);bus.addTo(map)}).catch(()=>{})}
   if(len&&v.pdist!=null)pct=Math.min(100,v.pdist/len*100)}
  const a=(await bt('actrealtime/prediction?vid='+vid)).prd||[];
  $('#stl').innerHTML=`<div style="font-size:22px;font-weight:700">Bus #${esc(vid)} Trip Information</div><div class="m" style="text-align:center;margin:14px 0 4px">Some stops already completed</div><div class="tl">`+a.slice(0,15).map((p,k)=>{const t=target&&target.id==p.stpid,n=p.prdctdn==='DUE'||p.prdctdn==='Due'?0:+p.prdctdn;
  return `<div class="ti"><i class="d ${t?'t':''}"></i><div class="sp"><b>${esc(p.stpnm)}</b><div class="m">Stop number: ${esc(p.stpid)}</div><div class="m">${n===0?'<span class="r">Arriving now</span>':'Arriving in <span class="r">'+n+' minute'+(n>1?'s':'')+'</span>'}</div><button class="${t?'o':'g'}" data-gi="${esc(p.stpid)}" data-gn="${esc(p.stpnm)}" style="margin-top:8px;min-height:36px">${t?'Your stop ✓':'Get off here'}</button></div>${k===0?'<span class="nx">NEXT ON<br>THIS TRIP</span>':''}</div>`}).join('')+'</div>';
  let ref=a[0],label='next stop';
  if(target){const t=a.find(p=>p.stpid==target.id);
   if(t){seen=true;ref=t;label=target.n;const m=t.prdctdn==='DUE'||t.prdctdn==='Due'?0:+t.prdctdn;
    if(m<=2&&!alerted)fire();else if(!alerted)banner(`Get off at <b>${esc(target.n)}</b> in ${mins(t)}`)}
   else if(seen){banner('You have passed '+esc(target.n));localStorage.removeItem('target');target=null}}else banner('');
  if(ref){const f=!$('#ov').firstChild;$('#ov').innerHTML=`<div class="ovc ${f?'':'na'}"><div class="row"><span class="pill">● FOLLOWING TRIP</span><span class="m" style="margin:0">Bus ${esc(vid)} · Line ${esc(rt)} to ${esc(des)}</span></div><div class="big">${mins(ref)}<small> to ${esc(label)}</small></div>${pct!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}<div class="up m">Next: ${a.slice(0,2).map(p=>esc(p.stpnm)+' ('+mins(p)+')').join(' · ')}</div></div>`}
  document.querySelectorAll('.err').forEach(x=>x.remove())}catch(e){fail(e)}}
 poll(tick,10000)}

function more(){const A=(n,u)=>`<a class="lk" target="_blank" rel="noopener" href="${u}"><span>${n}</span><span>›</span></a>`,W='https://www.actransit.org/';
 const L=`<div class="sh">USING AC TRANSIT</div>${A('Fare Information',W+'fares')}${A('Contactless Payment',W+'contactless-payment')}${A('Bikes',W+'bikes')}<div class="sh">CONTACT US</div>${A('Compliments and Feedback',W+'customer/customer-feedback/report')}${A('Lost and Found',W+'lostandfound')}${A('Contact Us',W+'contact-us')}<div class="sh">MORE SUPPORT</div>${A('District Website',W)}${A('News',W+'news')}${A('Subscriptions','https://service.govdelivery.com/accounts/ACTRANSIT/subscriber/new')}${A('Data terms and conditions',W+'data-terms-and-conditions/')}`;
 show(`<div class="card"><b>AC Transit API token</b><p class="m">Stored only on this device. Register for one at api.actransit.org/transit.</p>
<input id="tk" type="password" placeholder="Paste token (optional if your proxy holds it)" value="${esc(tok)}" aria-label="API token"></div>
<div class="card"><b>Proxy URL (fixes “Failed to fetch”)</b><p class="m">Your Cloudflare Worker address, e.g. https://bus.yourname.workers.dev</p><input id="px" placeholder="https://…workers.dev" value="${esc(PX)}" aria-label="Proxy URL"><p><button id="sv">Save &amp; reload</button></p></div>
<div class="card m">Unofficial app. Arrival data comes from the public AC Transit API and may be delayed or wrong. Map © OpenStreetMap; address search by Nominatim.</div>${L}`);
 $('#sv').onclick=()=>{localStorage.tok=$('#tk').value.trim();localStorage.proxy=$('#px').value.trim();location.reload()}}
go(tok||PX?'home':'more');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
